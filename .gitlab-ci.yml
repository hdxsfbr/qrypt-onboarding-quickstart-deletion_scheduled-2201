# GitLab CI (the repo lives on labs.gauntletai.com; runner: agentforge-ci-runner, Docker executor,
# untagged jobs). Four stages:
#   lint    — LOC and line-width limits, syntax checks, pinned requirements
#   test    — pytest against the mock server: Python 3.10 and 3.13, Node 20.12, 22 and 24
#   secrets — gitleaks over the full git history
#   deploy  — on the default branch only, after everything else passes: Cloudflare Pages
# No job needs a Qrypt key: the tests build their own sanitized environment and talk to the mock.
# Each job calls scripts/ci_checks.sh, the same script the pre-push hook runs locally.
# Every image is pinned to an exact tag. Node 20.12.0 is the documented minimum, so it is tested
# exactly rather than through a floating 20.x tag.
image: node:22.23.2-bookworm

stages: [lint, test, secrets, deploy]

variables:
  PIP_CACHE_DIR: '$CI_PROJECT_DIR/.pip-cache'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

cache:
  key: 'pip-$CI_JOB_NAME_SLUG'
  paths: ['.pip-cache/']

lint:
  stage: lint
  # The Node image is Debian-based and ships python3, so one image covers both checkers.
  script:
    - scripts/ci_checks.sh lint

test-python:
  stage: test
  image: python:${PYTHON_VERSION}-slim-bookworm
  parallel:
    matrix:
      - PYTHON_VERSION: ['3.10.21', '3.13.15']
  script:
    - pip install -r requirements-dev.txt
    - scripts/ci_checks.sh test-python

test-node:
  stage: test
  image: node:${NODE_VERSION}-bookworm
  parallel:
    matrix:
      - NODE_VERSION: ['20.12.0', '22.23.2', '24.20.0']
  before_script:
    # The Node images ship python3 but not the venv module or pip. The tests need pytest and
    # the Python dependencies, so install the venv package and build one.
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends python3-venv
    - python3 -m venv .venv
    - .venv/bin/pip install -r requirements-dev.txt
  script:
    - PYTEST=.venv/bin/pytest scripts/ci_checks.sh test-node

secrets:
  stage: secrets
  image:
    name: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: ['']
  variables:
    GIT_DEPTH: 0
  script:
    # `gitleaks git` scans the commit history; --redact keeps matched values out of the job log.
    - scripts/ci_checks.sh secrets

deploy:
  stage: deploy
  image: node:22.23.2-bookworm
  needs: [lint, test-python, test-node, secrets]
  # Cloudflare Pages (labs.gauntletai.com has no GitLab Pages). CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID are masked, protected project variables, so this only runs on main;
  # without the token the job is skipped rather than failed.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN'
  variables:
    WRANGLER_SEND_METRICS: 'false'
  script:
    - mkdir -p public
    - |
      cat > public/index.html <<'HTML'
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Qrypt Quickstart</title>
      </head>
      <body>
        <main>
          <h1>Qrypt Quickstart</h1>
          <p>Generate an AES-256 key from Qrypt quantum entropy with a short Node.js or Python script.</p>
        </main>
      </body>
      </html>
      HTML
    - >-
      npx -y wrangler@4.144.0 pages deploy public --project-name qrypt-quickstart --branch main
      --commit-hash "$CI_COMMIT_SHA" --commit-message "$CI_COMMIT_TITLE" </dev/null
